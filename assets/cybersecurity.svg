<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="درع وقفل لحماية الحسابات وكلمات المرور">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FEF5F8"/>
      <stop offset="1" stop-color="#F8C8D8"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FCE8EE"/>
    </linearGradient>
    <filter id="sh3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#C97E99" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg3)"/>
  <circle cx="100" cy="100" r="54" fill="#FFFFFF" opacity="0.42"/>
  <circle cx="715" cy="405" r="78" fill="#FFFFFF" opacity="0.32"/>
  <circle cx="700" cy="80" r="18" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="120" cy="420" r="20" fill="#FFFFFF" opacity="0.5"/>

  <!-- الدرع -->
  <g filter="url(#sh3)">
    <path d="M400 58 L540 112 v120 c0 92 -62 150 -140 182 -78 -32 -140 -90 -140 -182 V112 z" fill="url(#shield)" stroke="#E79AB4" stroke-width="7" stroke-linejoin="round"/>
    <path d="M400 78 L518 124 v108 c0 76 -51 126 -118 155 -67 -29 -118 -79 -118 -155 V124 z" fill="#FFFFFF" opacity="0.75"/>
  </g>

  <!-- القفل -->
  <g filter="url(#sh3)">
    <path d="M355 235 v-28 a45 45 0 0 1 90 0 v28" fill="none" stroke="#D47E9C" stroke-width="16" stroke-linecap="round"/>
    <rect x="338" y="232" width="124" height="96" rx="20" fill="#E79AB4"/>
    <rect x="348" y="242" width="104" height="76" rx="14" fill="#F8C8D8"/>
    <circle cx="400" cy="274" r="12" fill="#FFFFFF"/>
    <path d="M400 280 v20" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- نقاط كلمة المرور -->
  <g fill="#E79AB4" opacity="0.85">
    <circle cx="338" cy="360" r="8"/>
    <circle cx="370" cy="360" r="8"/>
    <circle cx="402" cy="360" r="8"/>
    <circle cx="434" cy="360" r="8"/>
    <circle cx="466" cy="360" r="8"/>
  </g>

  <!-- حاسوب صغير -->
  <g filter="url(#sh3)">
    <rect x="120" y="300" width="160" height="105" rx="14" fill="#FFFFFF" stroke="#F8C8D8" stroke-width="6"/>
    <rect x="136" y="316" width="128" height="70" rx="8" fill="#FCE8EE"/>
    <path d="M136 350 h128 M176 316 v70 M224 316 v70" stroke="#F8C8D8" stroke-width="3" opacity="0.7"/>
    <path d="M108 416 h184 l12 16 H96 z" fill="#E79AB4" opacity="0.85"/>
  </g>
  <!-- قفل صغير على الحاسوب -->
  <g transform="translate(200 344)">
    <path d="M-12 -6 v-8 a12 12 0 0 1 24 0 v8" fill="none" stroke="#D47E9C" stroke-width="5"/>
    <rect x="-16" y="-6" width="32" height="26" rx="7" fill="#E79AB4"/>
    <circle cx="0" cy="5" r="4" fill="#FFFFFF"/>
  </g>

  <!-- مفتاح -->
  <g transform="translate(610 300) rotate(-35)" filter="url(#sh3)">
    <circle cx="0" cy="0" r="28" fill="#FFFFFF" stroke="#E79AB4" stroke-width="8"/>
    <circle cx="0" cy="0" r="9" fill="#F8C8D8"/>
    <line x1="22" y1="20" x2="78" y2="76" stroke="#E79AB4" stroke-width="12" stroke-linecap="round"/>
    <line x1="58" y1="56" x2="76" y2="38" stroke="#E79AB4" stroke-width="10" stroke-linecap="round"/>
    <line x1="74" y1="72" x2="92" y2="54" stroke="#E79AB4" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="روبوت ذكي يتعلم من الكتب">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FEF5F8"/>
      <stop offset="1" stop-color="#F8C8D8"/>
    </linearGradient>
    <filter id="sh2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#C97E99" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg2)"/>
  <circle cx="710" cy="100" r="58" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="90" cy="410" r="72" fill="#FFFFFF" opacity="0.32"/>
  <circle cx="650" cy="430" r="16" fill="#FFFFFF" opacity="0.65"/>

  <!-- مصباح الفكرة -->
  <g filter="url(#sh2)">
    <path d="M400 45 a48 48 0 0 1 30 85 v20 h-60 v-20 a48 48 0 0 1 30 -85 z" fill="#FFFFFF"/>
    <path d="M400 60 a34 34 0 0 1 21 60 v14 h-42 v-14 a34 34 0 0 1 21 -60 z" fill="#FCE8EE"/>
    <rect x="382" y="158" width="36" height="12" rx="6" fill="#E79AB4"/>
    <rect x="388" y="174" width="24" height="10" rx="5" fill="#F8C8D8"/>
  </g>
  <g stroke="#E79AB4" stroke-width="4" stroke-linecap="round" opacity="0.7">
    <line x1="400" y1="20" x2="400" y2="34"/>
    <line x1="348" y1="46" x2="358" y2="56"/>
    <line x1="452" y1="46" x2="442" y2="56"/>
    <line x1="330" y1="100" x2="344" y2="100"/>
    <line x1="470" y1="100" x2="456" y2="100"/>
  </g>

  <!-- رأس الروبوت -->
  <g filter="url(#sh2)">
    <rect x="300" y="205" width="200" height="155" rx="38" fill="#FFFFFF" stroke="#F8C8D8" stroke-width="6"/>
    <rect x="326" y="238" width="148" height="66" rx="24" fill="#FCE8EE"/>
    <circle cx="365" cy="271" r="15" fill="#E79AB4"/>
    <circle cx="435" cy="271" r="15" fill="#E79AB4"/>
    <circle cx="360" cy="266" r="5" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="430" cy="266" r="5" fill="#FFFFFF" opacity="0.9"/>
    <path d="M370 312 q30 22 60 0" fill="none" stroke="#D47E9C" stroke-width="6" stroke-linecap="round"/>
    <rect x="385" y="176" width="30" height="30" rx="10" fill="#E79AB4"/>
    <circle cx="400" cy="168" r="10" fill="#F8C8D8"/>
  </g>
  <!-- الهوائيات -->
  <line x1="340" y1="205" x2="326" y2="182" stroke="#E79AB4" stroke-width="6" stroke-linecap="round"/>
  <line x1="460" y1="205" x2="474" y2="182" stroke="#E79AB4" stroke-width="6" stroke-linecap="round"/>
  <circle cx="322" cy="176" r="9" fill="#E79AB4"/>
  <circle cx="478" cy="176" r="9" fill="#E79AB4"/>

  <!-- الجسم -->
  <g filter="url(#sh2)">
    <path d="M330 365 q70 -34 140 0 l16 75 h-172 z" fill="#FFFFFF" stroke="#F8C8D8" stroke-width="6"/>
    <circle cx="400" cy="403" r="18" fill="#FCE8EE"/>
    <path d="M390 403 l8 8 14 -16" fill="none" stroke="#E79AB4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- الكتب -->
  <g filter="url(#sh2)">
    <rect x="150" y="370" width="150" height="26" rx="8" fill="#F8C8D8"/>
    <rect x="162" y="396" width="150" height="26" rx="8" fill="#E79AB4" opacity="0.85"/>
    <rect x="174" y="422" width="150" height="26" rx="8" fill="#FCE8EE" stroke="#F8C8D8" stroke-width="3"/>
    <rect x="500" y="370" width="150" height="26" rx="8" fill="#E79AB4" opacity="0.85"/>
    <rect x="488" y="396" width="150" height="26" rx="8" fill="#F8C8D8"/>
    <rect x="476" y="422" width="150" height="26" rx="8" fill="#FCE8EE" stroke="#F8C8D8" stroke-width="3"/>
  </g>

  <!-- طوق التخرج الصغير -->
  <g transform="translate(400 196) rotate(-12)">
    <path d="M-58 0 L0 -22 L58 0 L0 22 Z" fill="#E79AB4"/>
    <circle cx="0" cy="0" r="9" fill="#FFFFFF"/>
    <path d="M0 22 v18" stroke="#E79AB4" stroke-width="5" stroke-linecap="round"/>
  </g>

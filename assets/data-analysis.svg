<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="رسم بياني لتحليل درجات الطالبات">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FEF5F8"/>
      <stop offset="1" stop-color="#F8C8D8"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#E79AB4"/>
      <stop offset="1" stop-color="#F8C8D8"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#C97E99" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="95" cy="90" r="46" fill="#FFFFFF" opacity="0.45"/>
  <circle cx="720" cy="420" r="70" fill="#FFFFFF" opacity="0.35"/>
  <circle cx="690" cy="70" r="18" fill="#FFFFFF" opacity="0.6"/>

  <g filter="url(#sh)">
    <rect x="120" y="90" width="560" height="320" rx="24" fill="#FFFFFF"/>
    <rect x="120" y="90" width="560" height="52" rx="24" fill="#FCE8EE"/>
    <circle cx="152" cy="116" r="7" fill="#F8C8D8"/>
    <circle cx="176" cy="116" r="7" fill="#E79AB4"/>
    <circle cx="200" cy="116" r="7" fill="#F6D9E3"/>
  </g>

  <!-- محاور الرسم البياني -->
  <line x1="175" y1="360" x2="430" y2="360" stroke="#EBD2DB" stroke-width="3" stroke-linecap="round"/>
  <line x1="175" y1="360" x2="175" y2="175" stroke="#EBD2DB" stroke-width="3" stroke-linecap="round"/>

  <!-- أعمدة الدرجات -->
  <rect x="200" y="285" width="34" height="75" rx="8" fill="url(#bar)"/>
  <rect x="250" y="235" width="34" height="125" rx="8" fill="url(#bar)"/>
  <rect x="300" y="265" width="34" height="95" rx="8" fill="url(#bar)"/>
  <rect x="350" y="195" width="34" height="165" rx="8" fill="#E79AB4"/>
  <rect x="400" y="225" width="34" height="135" rx="8" fill="url(#bar)"/>

  <!-- نقاط بيانات -->
  <g fill="#FFFFFF" stroke="#E79AB4" stroke-width="3">
    <circle cx="217" cy="285" r="6"/>
    <circle cx="267" cy="235" r="6"/>
    <circle cx="317" cy="265" r="6"/>
    <circle cx="367" cy="195" r="6"/>
    <circle cx="417" cy="225" r="6"/>
  </g>

  <!-- خط الاتجاه -->
  <polyline points="217,285 267,235 317,265 367,195 417,225" fill="none" stroke="#D47E9C" stroke-width="3" stroke-dasharray="6 7" stroke-linecap="round" opacity="0.75"/>

  <!-- دائرة نسبة -->
  <g filter="url(#sh)">
    <circle cx="555" cy="270" r="78" fill="#FFFFFF"/>
  </g>
  <circle cx="555" cy="270" r="52" fill="none" stroke="#FCE8EE" stroke-width="22"/>
  <path d="M555 218 A52 52 0 1 1 510 297" fill="none" stroke="#E79AB4" stroke-width="22" stroke-linecap="round"/>
  <circle cx="555" cy="270" r="10" fill="#F8C8D8"/>

  <!-- بطاقات صغيرة -->
  <g opacity="0.9">
    <rect x="470" y="135" width="150" height="34" rx="17" fill="#FCE8EE"/>
    <rect x="486" y="146" width="70" height="12" rx="6" fill="#F8C8D8"/>
    <rect x="566" y="146" width="38" height="12" rx="6" fill="#E79AB4" opacity="0.6"/>
  </g>
</svg>
